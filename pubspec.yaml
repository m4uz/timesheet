name: timesheet
publish_to: 'none'
version: 0.0.0-semantically-released

environment:
  sdk: ^3.11.0
flutter:
  uses-material-design: true
  assets:
    - assets/config.json
    - assets/logo.png
flutter_launcher_icons:
  macos:
    generate: true
    image_path: assets/icon.png

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  macos_ui: ^2.2.2
  fluent_ui: ^4.14.0
  cupertino_calendar_picker: ^2.2.6
  provider: ^6.1.5+1
  openid_client: ^0.4.10+1
  url_launcher: ^6.3.2
  path: ^1.9.1
  logging: ^1.3.0
  sqflite_common_ffi: ^2.3.6
  path_provider: ^2.1.6
  webview_all: ^1.2.0
  webview_flutter_wkwebview: ^3.25.1

dev_dependencies:
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.14.0
  test: ^1.26.2
  flutter_launcher_icons: ^0.14.4
